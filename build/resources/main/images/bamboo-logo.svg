<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Logo minimalista de bambú para BambooVault -->
  <defs>
    <linearGradient id="bambooGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A7C2C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5016;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Tallo principal izquierdo -->
  <rect x="30" y="15" width="8" height="70" rx="4" fill="url(#bambooGradient)"/>
  
  <!-- Segmentos/nudos del tallo izquierdo -->
  <ellipse cx="34" cy="28" rx="5" ry="2" fill="#1F3810" opacity="0.6"/>
  <ellipse cx="34" cy="48" rx="5" ry="2" fill="#1F3810" opacity="0.6"/>
  <ellipse cx="34" cy="68" rx="5" ry="2" fill="#1F3810" opacity="0.6"/>
  
  <!-- Tallo principal derecho -->
  <rect x="62" y="25" width="8" height="65" rx="4" fill="url(#bambooGradient)"/>
  
  <!-- Segmentos/nudos del tallo derecho -->
  <ellipse cx="66" cy="38" rx="5" ry="2" fill="#1F3810" opacity="0.6"/>
  <ellipse cx="66" cy="58" rx="5" ry="2" fill="#1F3810" opacity="0.6"/>
  <ellipse cx="66" cy="78" rx="5" ry="2" fill="#1F3810" opacity="0.6"/>
  
  <!-- Hojas izquierdas superiores -->
  <path d="M 30 20 Q 15 18 10 25 Q 15 22 30 24" fill="#4A7C2C" opacity="0.9"/>
  <path d="M 32 30 Q 18 32 15 38 Q 20 34 32 34" fill="#3A6B1D" opacity="0.85"/>
  
  <!-- Hojas izquierdas inferiores -->
  <path d="M 30 50 Q 12 52 8 60 Q 14 54 30 54" fill="#4A7C2C" opacity="0.8"/>
  <path d="M 32 65 Q 18 68 12 75 Q 18 70 32 69" fill="#3A6B1D" opacity="0.75"/>
  
  <!-- Hojas derechas superiores -->
  <path d="M 70 28 Q 85 26 90 33 Q 85 30 70 32" fill="#4A7C2C" opacity="0.9"/>
  <path d="M 68 40 Q 82 42 85 48 Q 80 44 68 44" fill="#3A6B1D" opacity="0.85"/>
  
  <!-- Hojas derechas inferiores -->
  <path d="M 70 60 Q 88 62 92 70 Q 86 64 70 64" fill="#4A7C2C" opacity="0.8"/>
  <path d="M 68 75 Q 82 78 88 85 Q 82 80 68 79" fill="#3A6B1D" opacity="0.75"/>
</svg>
