plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'edu.sc.seis.launch4j' version '3.0.6' 
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'view.Main'
}

repositories {
    mavenCentral()
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    // SQLite
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    
    // JavaFX para Windows (clasificador 'win')
    implementation "org.openjfx:javafx-base:21.0.2:win"
    implementation "org.openjfx:javafx-graphics:21.0.2:win"
    implementation "org.openjfx:javafx-controls:21.0.2:win"
    implementation "org.openjfx:javafx-fxml:21.0.2:win"
    
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.cucumber:cucumber-java:7.15.0'
    testImplementation 'io.cucumber:cucumber-junit:7.15.0'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.8.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'com.h2database:h2:2.2.224'
}

// Configuración Launch4j para crear el .exe
launch4j {
    mainClassName = 'view.Main'
    outfile = 'LumiVault.exe'
    bundledJrePath = 'jre'
    jreMinVersion = '21'
    headerType = 'gui'
    dontWrapJar = true
    jarTask = tasks.shadowJar
}

// Fat JAR con todas las dependencias incluidas
tasks.named('shadowJar') {
    archiveBaseName.set('lumiVault')
    archiveClassifier.set('')
    archiveVersion.set('')
    
    manifest {
        attributes 'Main-Class': 'view.Main'
    }
    
    // Incluir dependencias de JavaFX para Windows
    configurations = [project.configurations.runtimeClasspath]
}

// Resolver dependencias entre tareas
tasks.named('distZip') {
    dependsOn tasks.shadowJar
}

tasks.named('distTar') {
    dependsOn tasks.shadowJar
}

tasks.named('startScripts') {
    dependsOn tasks.shadowJar
}

tasks.named('startShadowScripts') {
    dependsOn tasks.jar
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}