<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Logo de bombilla moderna para LumiVault -->
  <defs>
    <!-- Gradiente para la bombilla -->
    <linearGradient id="bulbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente para la base -->
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#808080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#505050;stop-opacity:1" />
    </linearGradient>
    
    <!-- Resplandor -->
    <radialGradient id="glowGradient" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFF99;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Resplandor de fondo -->
  <circle cx="50" cy="35" r="30" fill="url(#glowGradient)"/>
  
  <!-- Rayos de luz superiores -->
  <path d="M 50 8 L 48 18 L 52 18 Z" fill="#FFD700" opacity="0.7"/>
  <path d="M 30 15 L 33 23 L 38 20 Z" fill="#FFD700" opacity="0.6"/>
  <path d="M 70 15 L 67 23 L 62 20 Z" fill="#FFD700" opacity="0.6"/>
  <path d="M 18 28 L 24 32 L 24 26 Z" fill="#FFA500" opacity="0.5"/>
  <path d="M 82 28 L 76 32 L 76 26 Z" fill="#FFA500" opacity="0.5"/>
  
  <!-- Bulbo principal (círculo superior de la bombilla) -->
  <circle cx="50" cy="35" r="18" fill="url(#bulbGradient)" stroke="#FFA500" stroke-width="1"/>
  
  <!-- Filamento interno -->
  <path d="M 45 30 Q 50 28 55 30" stroke="#FF8C00" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 44 35 Q 50 32 56 35" stroke="#FF8C00" stroke-width="1.5" fill="none" opacity="0.6"/>
  <line x1="50" y1="30" x2="50" y2="42" stroke="#FF8C00" stroke-width="1" opacity="0.4"/>
  
  <!-- Parte inferior de la bombilla (cuello) -->
  <rect x="43" y="50" width="14" height="8" rx="1" fill="#E0E0E0" stroke="#C0C0C0" stroke-width="0.5"/>
  
  <!-- Base/casquillo de rosca -->
  <rect x="42" y="58" width="16" height="3" fill="url(#baseGradient)"/>
  <rect x="42" y="62" width="16" height="3" fill="url(#baseGradient)" opacity="0.8"/>
  <rect x="42" y="66" width="16" height="3" fill="url(#baseGradient)" opacity="0.6"/>
  <rect x="43" y="69" width="14" height="4" rx="1" fill="#404040"/>
  
  <!-- Detalles de brillo en el bulbo -->
  <ellipse cx="42" cy="28" rx="4" ry="6" fill="#FFFFFF" opacity="0.4"/>
  <ellipse cx="46" cy="32" rx="2" ry="3" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Rayos de luz laterales -->
  <line x1="22" y1="35" x2="32" y2="35" stroke="#FFD700" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="68" y1="35" x2="78" y2="35" stroke="#FFD700" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="26" y1="45" x2="34" y2="42" stroke="#FFA500" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="74" y1="45" x2="66" y2="42" stroke="#FFA500" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
</svg>
